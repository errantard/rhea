<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhea TechOps</title>
    <!-- Supabase 연동용 SDK (테스트 버전에서 새로 추가) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- ═══════════════════════════════════════════════════════════════
         [PART 1] STYLE — 전체 디자인/레이아웃 CSS
         ═══════════════════════════════════════════════════════════════ -->
    <style>
        :root {
            --ink: #0A1729;      /* 상단 네브바 다크 네이비 (로그인 화면과 통일) */
            --ink2: #17293F;     /* 활성 탭 배경 (한 단계 밝은 네이비) */
            --mint: #C3D6E6;     /* 비활성 탭 텍스트 (쿨톤 블루그레이, 밝게) */
            --teal: #0F6E5C;     /* 메인 액센트(버튼/성공) */
            --teal-dark: #0B5344;
            --amber: #F2C94C;    /* 로고/관리자 뱃지 */
            --coral: #C1552C;    /* 경고/지원 */
            --coral-text: #A54823; /* 연분홍(#F7E2D8) 배지 위에 올라가는 코랄 글씨 전용 — 명암비 4.5:1 이상 확보용으로 var(--coral)보다 살짝 더 진하게 */
            --paper: #FBFAF6;    /* 배경 */
            --paper2: #F5F2EA;   /* 스트립/표시 영역 */
            --border-warm: #E7E3D9;
            --muted: #8a8578;
            --muted-light: #787360; /* 2026-08-29: 명암비 개선 — 기존 #a29c8a(흰 배경 위 2.7:1)는 WCAG AA(4.5:1) 미달이라 살짝 더 진한 톤으로 조정(4.75:1) */
            /* ---- 디자인 토큰 확장 (2026-08-29): 반경/간격 스케일화 + 경고색 통합 + 표 밀도 프리셋 ---- */
            --r-xs: 4px; --r-sm: 7px; --r-md: 10px; --r-lg: 14px; --r-pill: 20px;
            --sp-0: 2px; --sp-1: 4px; --sp-2: 6px; --sp-3: 8px; --sp-4: 10px; --sp-5: 12px; --sp-6: 16px; --sp-7: 20px;
            /* 대시보드 전역 "위험/주의" 경고색 — .rental-alert와 "요청" 카드가 항상 이 색을 공유 (하나만 바꾸면 전체 반영) */
            --coral-dark: #FF9E76;
            --coral-dark-hover: #FFB395;
            --coral-dark-tint: #FFD1BB;
            --coral-dark-bg-active: rgba(255,158,118,0.22);
            /* 표 밀도 프리셋 기본값(=기본 밀도). #customerTable.density-compact / .density-comfortable 가 아래서 재정의 */
            --tbl-font: 11.7px; --tbl-pad-v: 6px; --tbl-pad-h: 10px;
            /* 네이비+격자 배경 패턴 (navbar·hero·toggles·side-accent 4곳에서 공통으로 사용).
               색/격자 간격을 바꾸고 싶으면 여기 한 곳만 고치면 4곳 전부 반영됨 */
            --navy-grid-bg:
                repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 46px),
                repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 46px),
                linear-gradient(160deg, #0D2036 0%, #17293F 55%, #0D2036 100%);
            /* 2026-09-06 5차: 로그인 화면이 "핫스팟 좌표매핑"(원화 자체가 카드) 방식으로 완전히
               바뀌면서, 예전 CSS로 그리던 로그인 카드 팔레트 변수들(로즈골드 1번/글로우/패널
               배경/테두리/잉크 톤, 룬석벽 리스킨용 파란 악센트 등)이 전부 미사용 상태가 되어
               제거함. 실제 쓰이는 건 눈 아이콘 hover 색상 하나(--login-gold-2)뿐이라 그것만 남김. */
            --login-gold-2: #E5C384;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Public Sans', 'Malgun Gothic', 'Segoe UI', sans-serif; }
        .mono-num { font-family: 'IBM Plex Mono', 'Malgun Gothic', monospace; font-variant-numeric: tabular-nums; }
        body { background-color: var(--paper); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        input[type="checkbox"] { accent-color: var(--amber); }/* ===================== Supabase 로그인 오버레이 ===================== */
        /* 2026-09-12 7차: 로그인 배경 원화를 완전히 새로운 구도("받침대 위 기사 석상 + 뒤쪽 대성당 +
           보름달" 다크판타지 씬)로 전면 교체. 이전 6차 계열("고대 비석형·벽면 일체형")의 룬 5개
           점광원, 텍스트 스윕, 먼지/불씨 파티클 이펙트 레이어는 전부 그 원화의 특정 픽셀 요소(엠블럼
           안 룬 글자, 특정 위치의 벽걸이 횃불 등)에 좌표를 맞춰 만든 것이라, 원화 자체가 완전히 다른
           구도로 바뀌면서 전부 무효가 됨 — 좌표만 억지로 새로 잡아도 애초에 그 요소들(파란 룬 등)이
           새 원화엔 존재하지 않아 의미가 없으므로, 이번엔 과거 이펙트를 재활용하지 않고 전부 제거하고
           깨끗한 상태로 다시 시작함(필요하면 새 원화의 횃불 2개 위치를 다시 실측해서 나중에 다시
           추가 가능 — 아래 syncLoginHotspots()는 여전히 같은 scale/offset 수식을 쓰므로 확장 쉬움).
           핵심 구조는 그대로 유지: 하나의 완성된 원화(assets/login-bg-scene.webp)를 배경으로 쓰고,
           그 위에 "보이지 않는" 진짜 입력창/체크박스/버튼만 좌표로 정확히 겹쳐 올리는 "핫스팟" 방식. */
        #loginOverlay {
            position: fixed; inset: 0; z-index: 9999;
            background-color: #09080d;
            overflow: hidden;
        }
        .login-bg-image {
            position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background-repeat: no-repeat;
            opacity: 0; transition: opacity 0.6s ease;
        }
        #loginOverlay.reveal-card .login-bg-image { opacity: 1; }
        #loginOverlay::before {
            content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none;
            background: linear-gradient(180deg, rgba(4,6,10,0.10) 0%, rgba(4,6,10,0.02) 32%, rgba(4,6,10,0.30) 76%, rgba(4,6,10,0.58) 100%);
        }
        #loginOverlay.hidden { display: none; }
        @media (prefers-reduced-motion: reduce) {
            .login-bg-image, .login-content { transition: none; }
        }

        /* 2026-09-12 7차-2: 챗지피티 추천 이펙트 2종 반영 — (1) 아주 옅은 안개(하단 30%만, 전체화면에
           깔면 원화의 선명함이 죽어서 하단 일부에만 약하게), (2) 촛불 흔들림(원화 하단 계단에 이미
           그려진 촛불 무리 위에 은은한 빛 웅덩이만 얹어 미세하게 깜빡이게 함 — 원화 자체는 그대로,
           투명 글로우 레이어만 겹치는 기존 fx-torch 방식과 동일 원리). */
        /* 2026-09-14 9차-10: 대장님이 "안개가 있는지도 모르겠다"고 함 — 측정해보니 실제로는 애니메이션이
           돌고는 있는데(로드 후 정착 시점 기준 밝기 스윙이 하단 안개 26~28, 폭포 안개 92~99 정도),
           범위가 좁아서 정적인 배경처럼 보이는 게 맞았음. 챗지피티가 제안한 "화면 전체 새 공기층
           레이어 추가"는 기각(그 자체가 더 옅게 설계된 제안이라 기존과 똑같이 안 보일 위험) — 대신
           대장님 선택대로 새 레이어 없이 기존 두 안개(.login-fog / .login-fog-mist)의 opacity·이동폭
           진폭만 키워서 실제로 체감되게 함. 원화 선명도는 blur/blend 방식 그대로라 훼손 없음. */
        .login-fog {
            position: absolute; left: 0; right: 0; bottom: 0; height: 34%;
            pointer-events: none; z-index: 1; opacity: 0.8; mix-blend-mode: screen;
            background: radial-gradient(ellipse at 50% 100%, rgba(190,202,214,0.11), rgba(190,202,214,0) 62%);
            filter: blur(22px);
            animation: fxFogDrift 17s ease-in-out infinite alternate;
        }
        @keyframes fxFogDrift {
            0%   { transform: translate(-2.4%, 0.5%);  opacity: 0.36; }
            45%  { transform: translate(2.2%, -2.6%);  opacity: 0.96; }
            100% { transform: translate(-1.4%, 1.1%);  opacity: 0.5; }
        }
        /* 2026-09-14 9차: 대장님 요청으로 계단 촛불 무리 위 pulsing 글로우(.login-fx-candle, 구버전)는
           완전히 제거하고 아래 3종 이펙트로 교체 — ① 명판 좌우 대형 횃불(브라지어) 불꽃 흔들림,
           ② 촛불 자리엔 은은한 불씨 파티클, ③ 오른쪽 폭포 착수부 국소 물안개.
           (챗지피티가 준 5가지 아이디어 중 이 배경화면에 실제로 있는 요소와 맞는 것만 골라 적용 —
           안개를 화면 전체에 까는 것 등 원화 선명도를 해치는 제안은 그대로 따르지 않고 축소/각색함.) */

        /* ① 횃불 불꽃 흔들림 + 주변 빛 흔들림 — 명판 좌우 대형 브라지어(assets 원화에 이미 불꽃이
           그려진 두 곳)에 얹음. 촛불 pulsing과 다르게 불꽃 "모양" 자체가 scaleY/scaleX/translateX로
           옆으로 살짝씩 흔들리는 레이어(.torch-flame)와, 그 주변으로 번지는 주황빛이 숨쉬듯 opacity/
           scale이 변하는 레이어(.torch-halo)를 분리해서 얹음 — 완전히 꺼졌다 켜지지 않고 항상
           "살아서 흔들리는" 정도로만 범위를 좁게 유지, 개체별 주기는 1.8~3.5초 사이에서 서로 다르게
           둬서 두 횃불이 같은 박자로 움직이는 "싸구려 게임 홈페이지" 느낌을 피함. */
        .login-fx-torch {
            position: absolute; pointer-events: none; z-index: 1; mix-blend-mode: screen;
        }
        .login-fx-torch .torch-halo {
            position: absolute; inset: 8%; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,170,90,0.26) 0%, rgba(255,130,50,0.10) 50%, rgba(255,90,30,0) 75%);
            filter: blur(10px);
            animation: fxTorchHalo 3s ease-in-out infinite;
        }
        .login-fx-torch .torch-flame {
            position: absolute; left: 50%; top: 46%; width: 34%; height: 48%;
            transform: translate(-50%, -50%); transform-origin: 50% 88%;
            background: radial-gradient(ellipse at 50% 30%, rgba(255,235,180,0.55) 0%, rgba(255,160,70,0.32) 46%, rgba(255,90,30,0) 78%);
            filter: blur(3px);
            border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
            animation: fxTorchFlame 2.3s ease-in-out infinite;
        }
        #fxTorchLeft .torch-flame  { animation-duration: 2.1s; }
        #fxTorchLeft .torch-halo   { animation-duration: 2.9s; }
        #fxTorchRight .torch-flame { animation-duration: 2.7s; animation-delay: -1s; }
        #fxTorchRight .torch-halo  { animation-duration: 3.4s; animation-delay: -0.6s; }
        @keyframes fxTorchFlame {
            0%, 100% { transform: translate(-50%, -50%) scaleY(1)    scaleX(1)    translateX(0);    opacity: 0.5; }
            25%      { transform: translate(-50%, -50%) scaleY(1.14) scaleX(0.9)  translateX(-3%);  opacity: 0.68; }
            50%      { transform: translate(-50%, -50%) scaleY(0.92) scaleX(1.06) translateX(2%);   opacity: 0.38; }
            75%      { transform: translate(-50%, -50%) scaleY(1.08) scaleX(0.95) translateX(-2%);  opacity: 0.6; }
        }
        @keyframes fxTorchHalo {
            0%, 100% { opacity: 0.32; transform: scale(1); }
            50%      { opacity: 0.55; transform: scale(1.08); }
        }

        /* ⑤ 횃불 먼지 파티클 — 2026-09-14 9차-3: 계단 촛불에서 솟아오르던 이전 버전은 "바닥에서
           불씨가 난다"는 느낌이라 피드백을 받고 전면 교체. 화면에 보이는 횃불(명판 좌우 대형 2개 +
           검 옆/배너 옆/폭포 쪽 벽걸이 횃불)마다 그 위 아주 가까운 자리에 작은 먼지 입자 1~2개만
           살짝 떠올랐다 사그라드는 정도로 얹음 — 불씨라기보단 "횃불 열기에 날리는 재/먼지" 느낌으로
           이동 범위도 짧게(12~24px) 줄임. 흰색(.dust-white) 입자는 진짜 작게 만들어서 눈이 쌓인
           화면 좌우 바깥쪽 횃불(검 옆/폭포 쪽)에만 아주 소량 섞음. */
        .login-fx-dust {
            position: absolute; pointer-events: none; z-index: 1; overflow: visible;
            mix-blend-mode: screen;
        }
        .login-fx-dust .dust {
            position: absolute; width: var(--sz, 1.8px); height: var(--sz, 1.8px);
            border-radius: 50%; opacity: 0;
            box-shadow: 0 0 5px 1px currentColor; /* 2026-09-14 9차-4: 어두운 배경 사진 속에서 그냥
                점만 찍으면 묻혀서 안 보인다는 피드백 → currentColor 글로우로 존재감을 더함(색은
                JS에서 background와 함께 color도 같이 셋팅) */
            animation-name: fxDustFloat; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
        }
        .login-fx-dust .dust-white { box-shadow: 0 0 3px 0.5px rgba(255,255,255,0.6); }
        /* 2026-09-14 9차-4: "떠오르는 게 티가 안 난다" 피드백 → 짧게 위로만 뜨던 것에서, 옆으로도
           제법 흩날리는(바람에 날리는 재 느낌) 궤적으로 재설계. 이동 거리도 훨씬 늘림(--dy 35~70px). */
        @keyframes fxDustFloat {
            0%   { transform: translate(0, 0) scale(0.4); opacity: 0; }
            20%  { transform: translate(calc(var(--dx, 14px) * 0.35), calc(var(--dy, -45px) * 0.3))  scale(1);    opacity: 0.9; }
            55%  { transform: translate(calc(var(--dx, 14px) * 0.8),  calc(var(--dy, -45px) * 0.6))  scale(0.6);  opacity: 0.5; }
            100% { transform: translate(var(--dx, 14px), var(--dy, -45px)) scale(0.15); opacity: 0; }
        }

        /* 2026-09-14 9차-5: 눈발(전체 화면 낙하)은 "너무 과하다"는 피드백으로 완전히 폐기 — 대신
           재(ash)가 공중에 떠서 아주 천천히 흩날리는 느낌으로 교체. 눈처럼 위→아래로 떨어지는 게
           아니라, 이미 공중에 떠 있던 재가 느릿하게 위아래/좌우로 표류하다 사라지는 쪽이 실제
           불씨 재 느낌에 더 가까워서 화면 전체(뷰포트) 아무 위치에서나 시작하도록 함. 크기/개수/
           밝기 전부 크게 낮춰서 눈발보다 훨씬 절제된 인상. */
        .login-ashdrift {
            position: absolute; inset: 0; pointer-events: none; z-index: 1; overflow: hidden;
        }
        .login-ashdrift .ash {
            position: absolute; border-radius: 50%; background: #B9AF9E; opacity: 0;
            animation-name: fxAshDrift; animation-timing-function: ease-in-out; animation-iteration-count: infinite;
        }
        @keyframes fxAshDrift {
            0%   { transform: translate(0, 0); opacity: 0; }
            15%  { opacity: var(--op, 0.22); }
            50%  { transform: translate(var(--sway, 10px), var(--rise, -30px)); }
            85%  { opacity: var(--op, 0.22); }
            100% { transform: translate(calc(var(--sway, 10px) * -1), calc(var(--rise, -30px) * 1.7)); opacity: 0; }
        }

        /* ② 아주 옅은 안개 — 원화 전체에 깔면 선명도가 죽으므로, 하단 전역은 기존 .login-fog(아래)가
           이미 담당 중. 그와 별개로, 이 배경엔 마침 오른쪽에 폭포가 그려져 있어서 그 착수 지점에만
           국소적으로 아주 옅은 물안개 레이어를 하나 더 얹어 깊이감을 보탬(챗지피티 원안의 "폭포 옆
           안개" 아이디어를 실제 원화의 폭포 위치에 맞게 각색). */
        /* 2026-09-14 9차-2: 1차 버전은 opacity 변화폭이 좁고 주기도 길어서(14s) "그냥 하얗게 밝아지기만
           하는 정적인 얼룩"처럼 보인다는 피드백 → opacity 진폭을 크게 키우고 좌우로도 살짝 드리프트를
           줘서 짧은 시간 봐도 "떠다니는 안개"라는 게 느껴지도록 주기를 10초로 단축. */
        .login-fog-mist {
            position: absolute; pointer-events: none; z-index: 1; mix-blend-mode: screen;
            background: radial-gradient(ellipse at 50% 60%, rgba(205,215,225,0.22), rgba(205,215,225,0) 70%);
            filter: blur(16px);
            animation: fxMistDrift 10s ease-in-out infinite alternate;
        }
        @keyframes fxMistDrift {
            0%   { opacity: 0.12; transform: translate(-4.5%, 4%) scale(0.94); }
            50%  { opacity: 0.9;  transform: translate(4.5%, -5.5%) scale(1.16); }
            100% { opacity: 0.2;  transform: translate(-3%, 2.5%) scale(1.06); }
        }
        /* 2026-09-14 9차-9: 검 각인 글로우(9차-6~8, 세 번 다 시도)는 결국 전부 "허접하다"는 판정을
           받고 폐기 — 대장님이 대신 챗지피티가 제안한 다른 방향("횃불/화로의 동적 광원": 불꽃 자체는
           안 건드리고, 그 빛이 주변 돌벽/석상/갑옷/바닥/로그인 석판에 아주 미세하게 반사되어
           밝아졌다 어두워지는 효과, 2~4초 불규칙 주기, "효과가 움직인다고 느껴지면 실패"할 정도로
           약하게)을 검토해달라고 함 — 판단: 이미 있는 torch-flame/halo 인프라와 자연스럽게 어울리고
           리스크가 낮은 좋은 제안이라 채택. 기존 명판 좌우 대형 횃불(LOGIN_FX_TORCHES) 좌표를 그대로
           재사용하되, halo보다 훨씬 큰 반경의 아주 옅은 radial-gradient를 얹어서 화로 주변 돌벽/석상
           받침대/석판까지 빛이 번지는 느낌만 살짝 냄. mix-blend-mode: soft-light는 screen보다 훨씬
           순한 방식으로 "밝게"만 만들어서(어둡게는 절대 안 만듦) 은은한 반사광 표현에 적합 —
           opacity 진폭도 아주 좁게(0.3~0.6 사이) 잡고, 키프레임 퍼센트를 불균등하게 흩어서
           기계적으로 뛰지 않는 불규칙한 숨쉬기를 만듦. */
        .login-fx-ambient {
            position: absolute; pointer-events: none; z-index: 1;
            border-radius: 50%;
            mix-blend-mode: soft-light;
            background: radial-gradient(circle, rgba(255,180,120,0.9) 0%, rgba(255,155,95,0.5) 38%, rgba(255,130,70,0) 70%);
            animation: fxAmbientBreathe 3.6s ease-in-out infinite;
        }
        #fxAmbientLeft  { animation-duration: 3.3s; }
        #fxAmbientRight { animation-duration: 4.1s; animation-delay: -1.8s; }
        @keyframes fxAmbientBreathe {
            0%   { opacity: 0.32; }
            18%  { opacity: 0.48; }
            37%  { opacity: 0.36; }
            58%  { opacity: 0.58; }
            79%  { opacity: 0.4; }
            100% { opacity: 0.32; }
        }
        @media (prefers-reduced-motion: reduce) {
            .login-fog, .login-fog-mist, .torch-flame, .torch-halo, .dust, .ash, .login-fx-ambient { animation: none; }
        }

        /* ===================== 로그인 폼 "핫스팟" 레이어 =====================
           원화(assets/login-bg-scene.webp, 2752×1536) 안에 타이틀/아이콘/입력칸 홈/체크박스/버튼이
           전부 이미 돌에 새겨진 그림으로 그려져 있음. 그 위에 "보이지 않는" 진짜 <input>/<button>만
           좌표로 정확히 겹쳐 올려서, 카드를 CSS로 새로 그리지 않고도 100% 원화와 동일하게 보이면서
           실제 폼 기능(입력/포커스/제출)이 동작하게 함.
           화면 비율이 바뀌면 배경(cover)이 잘리는 위치가 달라지는 문제는 syncLoginHotspots()
           (스크립트 영역 참고, object-fit:cover 수학 공식)가 리사이즈/로드마다 재계산해서 해결 —
           좌표 기준값은 전부 원본 이미지 픽셀. */
        .login-content {
            position: absolute; inset: 0; z-index: 2;
            opacity: 0; transition: opacity 0.6s ease;
        }
        #loginOverlay.reveal-card .login-content { opacity: 1; }
        .login-hotspot {
            position: absolute; box-sizing: border-box;
        }
        /* ID/비밀번호 입력창: 그림에 이미 그려진 홈(빈 오목한 홈, 안내문구 없음)이 그대로 "입력창"처럼
           보이도록 배경/테두리 없이 완전히 투명하게 — 타이핑한 글자만 그 홈 위에 자연스럽게 얹힘.
           2026-09-12 7차: 새 원화는 입력칸 내부를 완전히 비워둔 채로(그림 자체에 안내문구가 전혀
           없음, 좌우 아이콘만 홈 밖에 별도로 새겨짐) 만들어서, 이전 6차-15의 ":not(:placeholder-shown)
           덮개" 트릭(타이핑한 글자와 원화 속 baked 안내문구가 겹쳐 보이는 문제 방지용)이 더 이상
           필요 없어짐 — 그만큼 코드가 단순해짐. */
        #loginEmail, #loginPassword {
            background: transparent; border: none; outline: none;
            color: #f2e6c8; font-family: Georgia, 'Times New Roman', serif; letter-spacing: 0.3px;
            padding: 0 0.6em 0 0.6em;
        }
        #loginPassword { padding-right: 2.4em; }
        #loginEmail::placeholder, #loginPassword::placeholder { color: transparent; }
        /* 2026-09-14 8차-9: 아래 앰버 글로우 테두리(box-shadow)는 원래 #loginEmail/#loginPassword
           본인에게 직접 걸려 있었는데, textNudgeNative가 그 입력창 자체에 transform으로 걸리다 보니
           box-shadow까지 같이 딸려서 움직여버림(칸 자체 좌표는 안 바뀌는데, "칸이 내려간다"고
           느껴진 진짜 원인 — transform은 요소가 그리는 모든 것(글자+box-shadow)을 통째로 옮김).
           그래서 이 글로우 테두리를 입력창과 완전히 분리된 별도 요소(#loginEmailGlow/
           #loginPasswordGlow, HTML/JS 쪽 참고)로 옮기고, 그 요소는 textNudgeNative 없이 순수
           LOGIN_HOTSPOTS 좌표에만 고정 — 이제 글자를 아무리 내려도 이 테두리는 배경그림 좌표에
           박제된 것처럼 절대 안 움직임. */
        .login-input-glow { pointer-events: none; }
        /* 2026-09-14 8차-10: 대장님 요청으로 위치 조정 중 헷갈림 방지 위해 잠시 꺼뒀다가,
           라벨 글자색이 이 글로우 없이는 배경 위에서 칙칙하게 죽어 보인다는 게 확인돼서
           8차-11에서 다시 복원함 — 아래 두 규칙은 8차-9 이후 값 그대로. */
        #loginEmail:not(:placeholder-shown) ~ #loginEmailGlow,
        #loginPassword:not(:placeholder-shown) ~ #loginPasswordGlow {
            box-shadow: inset 0 0 0 1px rgba(229,195,132,0.30), 0 0 8px rgba(229,195,132,0.12);
            border-radius: 6px;
        }
        #loginEmail:focus ~ #loginEmailGlow,
        #loginPassword:focus ~ #loginPasswordGlow {
            box-shadow: inset 0 0 0 2px rgba(229,195,132,0.55), 0 0 14px rgba(229,195,132,0.25);
            border-radius: 6px;
        }
        /* 2026-09-12 7차-2: 플로팅 라벨 — 대장님이 참고로 준 은행앱 로그인폼처럼, 평소엔 입력칸
           안쪽에 안내 텍스트처럼 앉아있다가 포커스/입력 시 작아지면서 위로 떠오르는 효과.
           원화 자체엔 안내문구가 없으므로(7차) 이 라벨은 순수 CSS/HTML로 새로 얹는 것 — sibling
           선택자(~)로 input 상태에 따라 반응하게 함(label이 input 바로 뒤에 와야 동작). */
        .login-floating-label {
            position: absolute; pointer-events: none; z-index: 3;
            display: flex; align-items: center;
            padding: 0 0.6em; box-sizing: border-box;
            font-family: Georgia, 'Times New Roman', serif; letter-spacing: 1.5px;
            color: rgba(242,230,200,0.42);
            transition: transform 0.22s ease, color 0.22s ease, opacity 0.22s ease, font-size 0.22s ease;
            white-space: nowrap;
        }
		#loginEmailLabel { transform: translateY(10px); }
		#loginPasswordLabel { transform: translateY(6px); }

        /* 2026-09-14 8차-8: 기존엔 아이디/패스워드가 이 규칙 하나(translateY 값 공유)를 같이 썼는데,
           패스워드 쪽만 살짝 내리려고 값을 바꾸면 아이디 쪽도 같이 움직여버리는 문제가 있어서
           완전히 두 개로 분리함 — 이제 아래 두 블록은 서로 완전히 독립적으로, 한쪽 값을 바꿔도
           다른 쪽엔 전혀 영향 없음. ⚠️ 파일을 편집기에 열어둔 채로 오래 두면 편집기가 들고 있는
           옛날 버전으로 덮어써질 수 있으니, 수정 전엔 항상 파일을 새로 열어서 최신 상태인지
           확인할 것. */
        #loginEmail:focus ~ #loginEmailLabel,
        #loginEmail:not(:placeholder-shown) ~ #loginEmailLabel {
            /* 명판 프레임 안 입력칸 사이 여백이 좁아서(제목 줄~ID칸, ID칸~PW칸 간격이 각각 15~20px
               정도) 라벨을 박스 밖으로 완전히 띄우면 위/아래 다른 요소와 겹침 — 그 대신 박스 안쪽
               상단으로만 살짝 떠오르게(은행앱처럼 박스 밖으로 나가지 않는 컴팩트 버전).
               2026-09-12 7차-3: 기존 scale(0.52) 방식은 라벨 중심이 박스 위쪽 테두리 밖으로
               절반 가까이 빠져나가 제목 줄과 겹쳐 보이고, 극소 크기(약 8px)로 시각적으로 축소된
               세리프 폰트가 화면(특히 Windows ClearType)에서 세로줄만 남은 것처럼 뭉개지는
               문제가 있었음 — scale() 대신 font-size 자체를 줄이고(라벨 폰트도 세리프 유지하되
               실제 렌더 크기를 키워 가독성 확보), translateY 값도 박스 테두리를 넘지 않도록
               재조정. --baseFs는 place()가 인라인으로 셋팅(입력창과 동일한 기준 크기).
               2026-09-14 8차-8: 아이디 전용으로 분리됨 — 이 값을 바꿔도 패스워드 쪽엔 영향 없음. */
            transform: translateY(-9%);
            font-size: max(8px, calc(var(--baseFs, 1em) * 0.60)) !important; /* JS가 인라인
               font-size를 직접 셋팅해서(다른 .login-hotspot 요소와 공유하는 place() 헬퍼) 그냥
               두면 인라인 스타일 우선순위에 밀려 이 규칙이 아예 적용되지 않음 — !important로
               명시 승격. max(8px, ...)는 아주 좁은 모바일 화면에서 너무 작아지는 것 방지 */
            color: rgba(242,230,200,0.42); /* 8차-2: 평소(placeholder) 색과 동일 — 밝아지지 않음 */
        }
        #loginPassword:focus ~ #loginPasswordLabel,
        #loginPassword:not(:placeholder-shown) ~ #loginPasswordLabel {
            /* 2026-09-14 8차-8: 패스워드 전용으로 분리됨 — 이 값을 바꿔도 아이디 쪽엔 영향 없음.
               나머지 설명은 위 아이디 블록과 동일(공통 이력 참고). */
            transform: translateY(-12%);
            font-size: max(8px, calc(var(--baseFs, 1em) * 0.60)) !important;
            color: rgba(242,230,200,0.42);
        }
        @media (prefers-reduced-motion: reduce) {
            .login-floating-label { transition: none; }
        }
        /* 위치/크기는 다른 .login-hotspot과 마찬가지로 syncLoginHotspots()가 비밀번호 입력창
           우측 안쪽 일부 영역으로 계산해서 인라인 style로 채움(부모 상대좌표가 아니라 오버레이
           기준 절대좌표라서 별도 wrapper 없이도 정확히 겹쳐짐) */
        .login-password-toggle {
            position: absolute; display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; padding: 0; cursor: pointer; color: rgba(242,230,200,0.55);
            transition: color 0.25s ease;
        }
        .login-password-toggle:hover { color: var(--login-gold-2); }
        .login-password-toggle svg { width: 60%; height: 60%; pointer-events: none; }
        /* 체크박스: 그림 속 빈 네모 칸을 그대로 클릭 영역으로 사용 — 평소엔 완전 투명하다가 체크되면
           그 칸 안에 은은한 금색 체크마크만 나타남(그림 자체는 항상 "체크 안 된" 빈 칸 상태로 고정 —
           2026-09-12 7차: 대장님이 baked 이미지가 처음부터 체크된 것처럼 보이면 안 된다고 지적해서
           명판 자체를 항상 빈 칸으로 새기도록 프롬프트를 확정함). */
        .login-checkbox-hotspot {
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .login-checkbox-hotspot input[type="checkbox"] { position: absolute; opacity: 0; width: 0; height: 0; }
        /* 옆 걸쇠 금속의 명암과 같은 방향으로 그림자를 겹겹이 얹어서 "쇠에 새겨진 체크마크"처럼 보이게 함 */
        .login-checkbox-mark {
            width: 74%; height: 74%; opacity: 0; transform: scale(0.5);
            transition: opacity 0.2s ease, transform 0.2s ease; pointer-events: none;
            filter:
                drop-shadow(-0.6px -0.6px 0.4px rgba(255,230,180,0.65))
                drop-shadow(1px 1.2px 0.6px rgba(0,0,0,0.9))
                drop-shadow(0 0 3px rgba(0,0,0,0.7));
        }
        .login-checkbox-hotspot input:checked + .login-checkbox-mark { opacity: 1; transform: scale(1); }
        /* "SEAL MY IDENTITY" 문구도 그림에 이미 있으므로, 접근성을 위한 텍스트만 남기고 시각적으로는
           숨김 처리(그림 속 문구가 라벨 역할을 대신함) */
        .login-remember-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        /* OPEN THE GATE 버튼: 그림 속 명판 그래픽 위에 완전히 투명한 실제 <button>만 얹음. 원화 자체에
           이미 테두리+글자가 은은하게 발광하는 상태로 새겨져 있어서, hover 시엔 그 불빛이 "확 밝아지는"
           느낌으로 box-shadow를 한층 더 강하게 얹어줌(2026-09-12 7차, 대장님 요청 — 평소엔 은은하게,
           마우스 올리면 화르륵 밝아지도록). */
        #loginBtn {
            background: transparent; border: none; padding: 0; cursor: pointer;
            font-size: 0; color: transparent; border-radius: 6px;
            transition: box-shadow 0.3s ease, background 0.3s ease;
        }
        #loginBtn:hover {
            background: rgba(255,180,90,0.14);
            box-shadow: 0 0 18px 2px rgba(255,190,110,0.55), 0 0 46px 10px rgba(255,140,60,0.3);
        }
        #loginBtn:active { background: rgba(255,180,90,0.22); }
        #loginBtn:disabled { cursor: not-allowed; opacity: 0.7; }
        #loginError {
            color: #ff8f6b; font-size: 12px; text-align: center; line-height: 1.3;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        /* ===================== 로그인 화면 배경 히스토리 메모 =====================
           영상 기반 인트로 → 여러 레이어를 합성한 던전 씬 → CSS로 그린 카드 → "핫스팟" 방식(원화 한 장 +
           좌표 매핑, 3차) → 여러 차례 원화 교체(6차 계열, "고대 비석형·벽면 일체형") → 2026-09-12 7차,
           "받침대 위 기사 석상 + 대성당 + 보름달" 구도로 전면 교체(현재). 핫스팟 매핑 방식 자체는
           3차 이후 한 번도 안 바뀌었고, 원화만 계속 교체되어 왔음. 자세한 내용은 #loginOverlay 규칙과
           syncLoginHotspots()/playLoginIntro() 참고. */


        @media (max-width: 880px) {
            /* 로그인 화면(#loginOverlay)은 position:fixed라 body 높이 설정과 무관하게 따로 화면 전체를
               차지하는데, 폰 브라우저가 주소창을 보여주고 있는 "첫 진입 순간"엔 100vh가 주소창까지 포함한
               더 큰 높이로 계산돼서 안의 내용(로고/문구)이 가운데정렬되며 위쪽이 주소창 밑에 가려 보이는
               문제가 있었음 → 지금 실제로 보이는 화면 높이 기준인 100dvh로 교체해서 해결 */
            #loginOverlay { height: 100vh; height: 100dvh; }
            /* 2026-09-05 3차: 로그인 화면이 "핫스팟 좌표 매핑" 방식으로 바뀌면서(위 CSS 블록 참고),
               카드가 더 이상 CSS로 그리는 별도 요소가 아니라 배경 그림 자체 + JS가 실시간 계산하는
               좌표라서, 모바일 전용으로 폭/패딩/폰트를 따로 손볼 게 없어짐 — syncLoginHotspots()가
               어떤 화면비에서도 항상 그림 속 정확한 위치에 입력창을 맞춰줌. */
        }
    </style>

<body>
    <!-- ═══════════════════════════════════════════════════════════════
         index.html — 로그인 전용 페이지 (2026-09-13 8차 파일 분리)

    <!-- ===================== Supabase 로그인 오버레이 =====================

        <div class="login-fx-torch" id="fxTorchRight"><span class="torch-flame"></span><span class="torch-halo"></span></div>

        <!-- 2026-09-14 9차-3: 화면에 보이는 횃불 5곳(명판 좌우 대형 2개 + 검 옆/배너 옆/폭포 쪽 벽걸이
             횃불)에 먼지 파티클 컨테이너. 실제 입자(span)는 스크립트 쪽에서 개수/흩날림을 랜덤하게
             생성해서 채움(9차-4, 아래 spawnTorchDust 참고) — 컨테이너 자체는 비워둠. -->
        <div class="login-fx-dust" id="fxDustMainLeft"></div>

        <div class="login-fx-dust" id="fxDustFarRight"></div>
        <!-- 2026-09-14 9차-5: 눈발 대신, 화면 전체에 아주 옅게 떠서 천천히 흩날리는 재(ash) 레이어 -->
        <div class="login-ashdrift" id="loginAshdrift"></div>
        <!-- 2026-09-14 9차: 오른쪽 폭포 착수 지점 국소 물안개 -->
        <div class="login-fog-mist" id="fxMistWaterfall"></div>
        <!-- 2026-09-12 7차: 원화(assets/login-bg-scene.webp) 안에 타이틀/아이콘/입력칸 홈/체크박스/
             버튼이 전부 이미 그려져 있음. 아래 form은 그 위에 "보이지 않는" 진짜 입력 요소만 좌표로
             겹쳐 올리는 핫스팟 레이어 — 실제 위치/크기는 syncLoginHotspots()가 매 리사이즈마다
             계산해서 인라인 style로 채워줌(아래 초기값은 자바스크립트 실행 전 깜빡임 방지용 대략치). -->
        <form class="login-content" id="loginForm" onsubmit="handleLogin(event); return false;" autocomplete="on">
            <input type="email" id="loginEmail" class="login-hotspot" name="email" autocomplete="username" placeholder=" " onkeydown="if(event.key==='Enter'){ event.preventDefault(); document.getElementById('loginPassword').focus(); }">
            <label class="login-hotspot login-floating-label" id="loginEmailLabel" for="loginEmail">Adventurer</label>
            <!-- 2026-09-14 8차-9: 앰버 글로우 테두리 전용 요소 — #loginEmail의 textNudgeNative transform과

            <div class="login-hotspot login-input-glow" id="loginEmailGlow"></div>
            <input type="password" id="loginPassword" class="login-hotspot" name="password" autocomplete="current-password" placeholder=" ">

    <script>
        /* ═══════════════════════════════════════════════════════════════
           [LOGIN PAGE] index.html 전용 스크립트
           2026-09-13 8차: 기존 단일 index.html(로그인+업체관리 통합)을
           index.html(로그인 전용, 이 파일) + dashboard.html(업체관리 전용)로 분리.
           분리 이유: 로그인 화면만 수정할 때도 매번 26만자짜리 통합 파일 전체를 훑어야 해서
           Claude 응답 속도/사용량 부담이 컸음 — 이제 로그인 관련 수정은 이 작은 파일만 보면 됨.
           흐름: ① Supabase 연결 → ② 로그인 화면 핫스팟 좌표 동기화 → ③ 아이디 기억하기 →
                 ④ 로그인 처리(성공 시 dashboard.html로 이동) → ⑤ 기존 세션 있으면 바로 이동
           ═══════════════════════════════════════════════════════════════ */

/* ===================== 로그인 화면 핫스팟 좌표 동기화 =====================
           "떠있는 UI 카드"가 아니라 "벽에 박힌 한 장의 그림"처럼 보이게 하기 위해, 카드를 CSS로
           그리지 않고 원화(assets/login-bg-scene.webp, 원본 해상도 2752×1536 — 타이틀/아이콘/입력칸
           홈/체크박스/버튼까지 전부 이미 그려져 있음) 위에 "보이지 않는" 진짜 입력 요소만 좌표로
           정확히 겹쳐 올림. LOGIN_HOTSPOTS 값은 그 원본 이미지를 픽셀 단위로 직접 측정해서 얻은 고정
           좌표(왼쪽,위,오른쪽,아래). background-size:cover가 화면 비율에 따라 이미지를 확대/크롭하는
           방식은 (컨테이너 크기, 이미지 원본 크기)만 알면 100% 예측 가능한 수학 공식이므로,
           syncLoginHotspots() 함수가 리사이즈/방향전환마다 재계산 — 화면 비율이 무엇이든 항상 그림
           속 정확한 자리에 입력창이 맞춰짐. */
        const LOGIN_BG_NATIVE_W = 2752, LOGIN_BG_NATIVE_H = 1536;
        /* 큰 모니터에서 그림이 화면 전체를 꽉 채우는 게 부담스럽다는 피드백 → cover 배율 계산 후
           이 값만큼 추가로 한 번 더 줄여서 상하좌우에 여백이 생기게 함(rawScale이 1보다 클 때만
           적용됨 — 일반 화면에서는 이 값을 낮춰도 체감 효과가 없을 수 있음, 의도된 동작).
           1.0 = 여백 없음, 값을 낮출수록 그림이 작아지고 여백이 커짐. */
        const LOGIN_BG_SHRINK = 0.85;
        /* 2026-09-12 7차: 원화를 "받침대 위 기사 석상 + 대성당 + 보름달" 구도로 완전히 새로 교체 —
           패널이 화면 중앙 하단부, 받침대 정면에 위치. 아래 6개 좌표는 전부 새 원화를 그리드
           오버레이로 확대해서 픽셀 단위로 재실측한 값(이전 6차 계열 "고대 비석형" 좌표는 구도가
           완전히 달라서 재활용 불가 — 전부 새로 측정). 입력칸 내부는 완전히 비워둔 채로(안내문구
           없음) 새겼기 때문에, 이전처럼 ":not(:placeholder-shown)" 덮개를 씌워 baked 안내문구를
           가릴 필요가 없어짐(CSS 영역 참고). */
        const LOGIN_HOTSPOTS = {
            id:       [1210, 1091, 1585, 1145], /* 2026-09-13 8차-3: 밝기 그래디언트로 실측한 결과
               기존 y좌표가 실제 명판 테두리보다 5px 위로 어긋나 있었음(패스워드 칸은 이미 정확했음) —
               ID 라벨/입력값이 유독 세로 중앙정렬이 안 맞아 보인 진짜 원인. 아래로 5px 보정. */
            password: [1210, 1158, 1585, 1212],
            /* 2026-09-14 8차-12: 금박 글로우 테두리 전용 좌표 — 대장님 요청으로 실제 입력창(id/password,
               클릭·타이핑 되는 진짜 영역)과 완전히 분리함. 지금은 값이 위 id/password와 동일해서
               시각적으로 아무 변화 없지만, 이 두 줄만 따로 건드리면 테두리만 움직이고 입력 가능
               영역은 전혀 안 움직임(반대도 마찬가지). */
            idGlow:       [1210, 1100, 1585, 1156],
            passwordGlow: [1210, 1168, 1585, 1222],
            toggle:   [1535, 1176, 1575, 1216],
            checkbox: [1128, 1240, 1167, 1280],
            enter:    [1393, 1233, 1585, 1288],
            /* 명판 프레임 안에는 에러 문구를 넣을 여유 공간이 따로 없어서(버튼 바로 아래가 곧 명판
               하단 테두리), 명판 밖 촛불 계단 쪽 어두운 배경 위에 배치 — #loginError에 이미 걸려있는
               text-shadow 덕분에 어두운 배경 위에서도 잘 읽힘. */
            error:    [1122, 1296, 1585, 1330]
        };
        /* 화면이 극단적으로 가로로 넓고 세로로 짧아서(예: 와이드 모니터 + 브라우저 주소창/북마크바로
           실사용 높이가 줄어든 상태) 순수 cover 배율대로면 버튼이나 에러문구가 화면 아래로 밀려날
           상황이면, 그 지점이 항상 화면 안쪽(margin만큼 여유 두고)에 들어오도록 배율 상한을 계산해서
           cover 배율과 비교해 더 작은 쪽을 씀. LOGIN_PANEL_SAFE_BOTTOM_NATIVE_Y = 패널에서 가장
           아래에 있는 요소(에러 문구 바깥 테두리 근처)의 원화 y좌표. */
        const LOGIN_PANEL_SAFE_BOTTOM_NATIVE_Y = 1330;
        /* 2026-09-14 9차 → 9차-2 재실측: 처음엔 "밝은 주황빛" 전체(R>170 등)로 잡았더니, 불꽃 위로
           뻗어나가는 장식용 번개/균열 이펙트(원화에 이미 그려진, 불꽃과는 별개인 효과)까지 같이
           잡혀서 halo 중심이 실제 불꽃보다 너무 위로/넓게 잡혔던 게 "좌표가 이상하다" 피드백의
           원인이었음 — connected-component로 가장 큰 덩어리(=불꽃 몸통)만 분리해서 재실측한 값. */
        const LOGIN_FX_TORCHES = {
            left:  [905, 1050, 85],
            right: [1769, 1080, 90]
        };
        /* 2026-09-14 9차-9: 횃불 주변 돌벽/석상/석판까지 은은하게 번지는 "동적 광원" — 중심좌표는
           위 LOGIN_FX_TORCHES와 동일(같은 불꽃에서 나오는 빛이므로), 반경만 훨씬 크게 잡아서 명판
           주변 넓은 영역을 옅게 덮음. */
        const LOGIN_FX_AMBIENT = {
            left:  [905, 1050, 420],
            right: [1769, 1080, 440]
        };
        /* 2026-09-14 9차-3: 화면에 보이는 횃불 5곳(원화를 connected-component 분석으로 재실측)의
           먼지 파티클 컨테이너 zone(x1, y1, x2, y2) — 각 횃불 불꽃 바로 위/주변을 감싸는 작은 박스. */
        const LOGIN_FX_DUST_ZONES = {
            mainLeft:  [845, 955, 975, 1105],   // 명판 좌측 대형 횃불
            mainRight: [1685, 995, 1845, 1145], // 명판 우측 대형 횃불
            swordLeft: [400, 940, 480, 1050],   // 검 옆 벽걸이 횃불(화면 좌측 바깥)
            lampRight: [1800, 880, 1890, 980],  // 배너 옆 벽걸이 횃불
            farRight:  [2030, 1190, 2110, 1280] // 폭포 아래쪽 원경 횃불(화면 우측 바깥)
        };
        /* 오른쪽 폭포 착수 지점 물안개 zone(x1, y1, x2, y2) — 원화 속 폭포가 바닥에 떨어지며 이미
           옅게 그려진 물보라 위치를 실측 */
        const LOGIN_FX_MIST_ZONE = [2050, 1080, 2400, 1250];
        function syncLoginHotspots() {
            const overlay = document.getElementById('loginOverlay');
            if (!overlay) return;
            const cw = overlay.clientWidth, ch = overlay.clientHeight;
            if (!cw || !ch) return;
            const coverScale = Math.max(cw / LOGIN_BG_NATIVE_W, ch / LOGIN_BG_NATIVE_H);
            const margin = 24; // 패널 아래로 최소 이만큼은 화면이 남도록
            const halfH = LOGIN_BG_NATIVE_H / 2;
            const capScale = (ch / 2 - margin) / (LOGIN_PANEL_SAFE_BOTTOM_NATIVE_Y - halfH);
            const rawScale = Math.min(coverScale, capScale > 0 ? capScale : coverScale);
            const scale = rawScale > 1 ? rawScale * LOGIN_BG_SHRINK : rawScale;
            const offsetX = (cw - LOGIN_BG_NATIVE_W * scale) / 2;
            const offsetY = (ch - LOGIN_BG_NATIVE_H * scale) / 2;
            // 배경 이미지도 입력창과 완전히 같은 배율/위치로 직접 그림 — CSS의 cover 키워드를 쓰지
            // 않으므로 위에서 배율을 줄여도(=화면이 극단적 비율이어도) 입력창과 절대 어긋나지 않음.
            const bgImageEl = document.getElementById('loginBgImage');
            if (bgImageEl) {
                bgImageEl.style.backgroundImage = "url('assets/login-bg-scene.webp')";
                bgImageEl.style.backgroundSize = (LOGIN_BG_NATIVE_W * scale) + 'px ' + (LOGIN_BG_NATIVE_H * scale) + 'px';
                bgImageEl.style.backgroundPosition = offsetX + 'px ' + offsetY + 'px';
            }
            const place = (el, key, fontRatio, textNudgeNative) => {
                if (!el) return;
                const [x1, y1, x2, y2] = LOGIN_HOTSPOTS[key];
                el.style.left = (offsetX + x1 * scale) + 'px';
                el.style.top = (offsetY + y1 * scale) + 'px';
                el.style.width = ((x2 - x1) * scale) + 'px';
                const height = (y2 - y1) * scale;
                el.style.height = height + 'px';
                if (fontRatio) {
                    const fs = Math.max(9, height * fontRatio);
                    el.style.fontSize = fs + 'px';
                    el.style.setProperty('--baseFs', fs + 'px');
                }
                /* 2026-09-14 8차-5: 대장님 지적 — 칸(왼/위/너비/높이, 위 4줄) 자체는 배경 그림과
                   그대로 딱 맞아야 하고(8차-3에서 픽셀 실측으로 이미 맞춰둔 값, 절대 건드리면 안 됨),
                   "살짝 아래로"는 칸이 아니라 그 안의 글자(타이핑한 값)만 내려달라는 의미였음.
                   8차-4에서 top 좌표 자체를 밀었던 건 결과적으로 칸까지 같이 밀어버린 잘못된 접근이라
                   되돌림. padding-top/line-height는 크롬이 <input> 값 텍스트에 무시한다는 게 실측
                   확인된 상태라(8차-4 참고) 못 쓰고, 대신 레이아웃 박스(top/left/width/height,
                   클릭 히트박스)는 전혀 안 바꾸면서 "그려지는 모습"만 살짝 옮기는 transform을 씀 —
                   레이아웃상 칸은 100% 원화와 일치한 채로 유지되고, 그 안의 글자만 미세하게(원화
                   기준 3px, 화면 배율에 비례) 아래로 보이게 됨.
                   2026-09-14 8차-7: 아이디(10)/패스워드(6) textNudgeNative 값이 서로 달라서 두 칸의
                   글자 줄간격이 다르게 보이는 진짜 원인이었음 — 아이디 기준(10)으로 통일. */
                if (textNudgeNative) {
                    el.style.transform = `translateY(${textNudgeNative * scale}px)`;
                }
            };
            place(document.getElementById('loginEmail'), 'id', 0.38, 18);
            place(document.getElementById('loginEmailLabel'), 'id', 0.40);
            place(document.getElementById('loginEmailGlow'), 'idGlow'); /* 8차-12: 전용 좌표(idGlow) 사용 — 실제 입력창(id)과 분리 */
            place(document.getElementById('loginPassword'), 'password', 0.38, 16);
            place(document.getElementById('loginPasswordLabel'), 'password', 0.40);
            place(document.getElementById('loginPasswordGlow'), 'passwordGlow'); /* 8차-12: 전용 좌표(passwordGlow) 사용 — 실제 입력창(password)과 분리 */
            place(document.getElementById('loginPasswordToggle'), 'toggle');
            place(document.getElementById('loginCheckboxHotspot'), 'checkbox');
            place(document.getElementById('loginBtn'), 'enter');
            place(document.getElementById('loginError'), 'error', 0.55);

            // 원(반지름) 기반 배치 — 횃불 halo용, 정사각형 박스가 아니라서 place()와 다른 헬퍼 사용
            const placeCircle = (el, [cx, cy, r]) => {
                if (!el) return;
                const rs = r * scale;
                el.style.left = (offsetX + cx * scale - rs) + 'px';
                el.style.top = (offsetY + cy * scale - rs) + 'px';
                el.style.width = (rs * 2) + 'px';
                el.style.height = (rs * 2) + 'px';
            };
            // 사각형 zone 기반 배치 — 불씨 파티클 컨테이너, 물안개 패치
            const placeBox = (el, [x1, y1, x2, y2]) => {
                if (!el) return;
                el.style.left = (offsetX + x1 * scale) + 'px';
                el.style.top = (offsetY + y1 * scale) + 'px';
                el.style.width = ((x2 - x1) * scale) + 'px';
                el.style.height = ((y2 - y1) * scale) + 'px';
            };
            placeCircle(document.getElementById('fxTorchLeft'), LOGIN_FX_TORCHES.left);
            placeCircle(document.getElementById('fxTorchRight'), LOGIN_FX_TORCHES.right);
            placeCircle(document.getElementById('fxAmbientLeft'), LOGIN_FX_AMBIENT.left);
            placeCircle(document.getElementById('fxAmbientRight'), LOGIN_FX_AMBIENT.right);
            placeBox(document.getElementById('fxDustMainLeft'), LOGIN_FX_DUST_ZONES.mainLeft);
            placeBox(document.getElementById('fxDustMainRight'), LOGIN_FX_DUST_ZONES.mainRight);
            placeBox(document.getElementById('fxDustSwordLeft'), LOGIN_FX_DUST_ZONES.swordLeft);
            placeBox(document.getElementById('fxDustLampRight'), LOGIN_FX_DUST_ZONES.lampRight);
            placeBox(document.getElementById('fxDustFarRight'), LOGIN_FX_DUST_ZONES.farRight);
            placeBox(document.getElementById('fxMistWaterfall'), LOGIN_FX_MIST_ZONE);
        }
        syncLoginHotspots();
        window.addEventListener('resize', syncLoginHotspots);
        window.addEventListener('orientationchange', syncLoginHotspots);

        /* ===================== 파티클 생성 (횃불 먼지 + 재 표류) =====================
           2026-09-14 9차-4: "티가 안 난다" 피드백으로 손으로 하나하나 span 치던 방식 대신 런타임
           생성으로 교체 — 개수/흩날림 폭을 상수 하나로 조절할 수 있고, 랜덤값 덕분에 자연스러운
           변주도 생김. 횃불 먼지 컨테이너(.login-fx-dust)는 syncLoginHotspots()가 좌표/크기를 잡아둔
           상태이고, #loginAshdrift는 CSS로 이미 화면 전체(inset:0)를 덮고 있음 — 두 경우 다 안의
           입자들은 전부 %(퍼센트) 기준이라 리사이즈 때 컨테이너만 따라가면 되므로 이 생성은 페이지
           로드 시 한 번만 실행하면 충분함(리사이즈마다 다시 만들 필요 없음). */
        function spawnTorchDust(containerId, count, colors, whiteCount) {
            const el = document.getElementById(containerId);
            if (!el) return;
            for (let i = 0; i < count; i++) {
                const s = document.createElement('span');
                const isWhite = whiteCount && i < whiteCount;
                s.className = 'dust' + (isWhite ? ' dust-white' : '');
                const color = isWhite ? '#F4F6F8' : colors[i % colors.length];
                s.style.background = color;
                s.style.color = color; /* box-shadow: currentColor 글로우용 */
                s.style.left = (8 + Math.random() * 78) + '%';
                s.style.bottom = (Math.random() * 55) + '%';
                const sz = isWhite ? (1.1 + Math.random() * 0.7) : (2.2 + Math.random() * 2.2);
                s.style.setProperty('--sz', sz.toFixed(1) + 'px');
                s.style.setProperty('--dx', (Math.random() * 50 - 20).toFixed(1) + 'px'); /* -20~30px 옆으로 흩날림 */
                s.style.setProperty('--dy', (-(35 + Math.random() * 35)).toFixed(1) + 'px'); /* -35~-70px 위로 */
                const dur = 3.2 + Math.random() * 3.2;
                s.style.animationDuration = dur.toFixed(2) + 's';
                s.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's'; /* 음수 delay로 시작부터 제각각 위상 */
                el.appendChild(s);
            }
        }
        /* 2026-09-14 9차-5: 눈발(spawnSnowfall, 화면 위→아래 낙하)은 폐기 — 화면 아무 데서나 떠서
           아주 느리게 표류하다 사라지는 재(ash)로 교체. 눈보다 훨씬 작고 느리고 옅게. */
        function spawnAshdrift(containerId, count) {
            const el = document.getElementById(containerId);
            if (!el) return;
            for (let i = 0; i < count; i++) {
                const s = document.createElement('span');
                s.className = 'ash';
                s.style.left = (Math.random() * 100) + '%';
                s.style.top = (Math.random() * 100) + '%';
                const sz = 1 + Math.random() * 1.4; /* 1~2.4px — 눈발보다 훨씬 작게 */
                s.style.width = sz.toFixed(1) + 'px';
                s.style.height = sz.toFixed(1) + 'px';
                s.style.setProperty('--op', (0.14 + Math.random() * 0.18).toFixed(2)); /* 0.14~0.32 — 훨씬 옅게 */
                s.style.setProperty('--sway', (6 + Math.random() * 10).toFixed(1) + 'px');
                s.style.setProperty('--rise', (-(14 + Math.random() * 18)).toFixed(1) + 'px');
                const dur = 16 + Math.random() * 14; /* 16~30초 — "천천히" 표류 */
                s.style.animationDuration = dur.toFixed(2) + 's';
                s.style.animationDelay = (-Math.random() * dur).toFixed(2) + 's';
                el.appendChild(s);
            }
        }
        spawnTorchDust('fxDustMainLeft',  6, ['#F2C94C', '#FF8A3D', '#9AA0A6']);
        spawnTorchDust('fxDustMainRight', 6, ['#FF8A3D', '#F2C94C', '#9AA0A6']);
        spawnTorchDust('fxDustSwordLeft', 4, ['#F2C94C', '#9AA0A6'], 1);
        spawnTorchDust('fxDustLampRight', 4, ['#9AA0A6', '#FF8A3D']);
        spawnTorchDust('fxDustFarRight',  4, ['#FF8A3D', '#9AA0A6'], 1);
        spawnAshdrift('loginAshdrift', 22);

        (function playLoginIntro() {
            const overlay = document.getElementById('loginOverlay');
            if (!overlay) return;
            // 배경 이미지가 실제로 로드된 뒤 한 번 더 좌표를 재계산(레이아웃/캐시 타이밍 이슈 방지)
            // 하고 나서 페이드인 — 좌표가 틀어진 채로 잠깐 보이는 깜빡임을 막기 위함.
            const img = new Image();
            img.onload = function () {
                syncLoginHotspots();
                requestAnimationFrame(() => overlay.classList.add('reveal-card'));
            };
            img.onerror = function () { overlay.classList.add('reveal-card'); };
            img.src = 'assets/login-bg-scene.webp';
        })();

        // "아이디 저장" 체크박스 - 비밀번호는 절대 저장 안 하고, 이메일 주소만 이 브라우저에 기억해둠
        // (비밀번호 저장/자동완성은 브라우저 자체 비밀번호 관리자가 담당)
        const REMEMBER_EMAIL_KEY = 'kiosk_remembered_email';
        (function restoreRememberedEmail() {
            const saved = localStorage.getItem(REMEMBER_EMAIL_KEY);
            if (saved) {
                document.getElementById('loginEmail').value = saved;
                document.getElementById('rememberEmailCheck').checked = true;
            }
        })();

        /* ===================== ① Supabase 연결 설정 =====================
           ⚠️ SUPABASE_URL 부분만 대장님이 직접 채워주셔야 해요!
           Supabase 대시보드 → 프로젝트 → Project Settings → Data API 페이지에서
           "Project URL" 값을 복사해서 아래 따옴표 안에 붙여넣어주세요. (예: https://abcdefgh.supabase.co)
        */
        const SUPABASE_URL = 'https://ioqxulvuasjsabcvikug.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_ZDDxH_TUePOMfhVZCGY1pw_1mgtfK9G';
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

function togglePasswordVisibility() {
            const input = document.getElementById('loginPassword');
            const openIcon = document.getElementById('eyeIconOpen');
            const closedIcon = document.getElementById('eyeIconClosed');
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            openIcon.style.display = showing ? '' : 'none';
            closedIcon.style.display = showing ? 'none' : '';
        }

                async function handleLogin(event) {
            if (event) event.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errEl = document.getElementById('loginError');
            errEl.textContent = '';
            if (!email || !password) {
                errEl.textContent = 'Please enter both email and password.';
                return;
            }
            btn.disabled = true;
            btn.textContent = 'SIGNING IN...';
            try {
                const { error } = await sb.auth.signInWithPassword({ email, password });
                if (error) {
                    errEl.textContent = 'Login failed: please check your email or password.';
                    return;
                }
                if (document.getElementById('rememberEmailCheck').checked) {
                    localStorage.setItem(REMEMBER_EMAIL_KEY, email);
                } else {
                    localStorage.removeItem(REMEMBER_EMAIL_KEY);
                }
                /* 8차: 파일 분리 이후 로그인 성공 시 여기서 initApp()을 직접 부르지 않고
                   dashboard.html로 이동만 함 — 실제 데이터 로딩/화면 렌더링은 dashboard.html
                   자신이 부팅 시(bootDashboard()) 세션을 확인하고 알아서 진행함. */
                location.replace('dashboard.html');
            } catch (err) {
                console.error(err);
                errEl.textContent = 'Connection error. Please check the SUPABASE_URL setting.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'LOG IN';
            }
        }

        // 페이지를 새로고침해도 로그인이 풀리지 않도록, 시작할 때 기존 세션이 있는지 먼저 확인
        // (8차: 같은 페이지에서 화면을 바꾸는 대신, 이미 로그인돼 있으면 dashboard.html로 이동)
        async function checkExistingSession() {
            const { data } = await sb.auth.getSession();
            if (data && data.session) {
                location.replace('dashboard.html');
            }
        }
        checkExistingSession();
    </script>
