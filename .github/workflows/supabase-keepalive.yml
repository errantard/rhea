# Supabase 무료 프로젝트는 1주일 동안 DB 요청이 없으면 일시정지됨 → 매일 한 번 아주 작은 읽기 요청으로 깨워둠
# (업체 데이터는 안 건드림 · groups 표 id 1줄만 읽기 · 키는 대시보드에 이미 공개된 publishable 키)
# 대장님 결정 2026-11-23: 매일 1번 · 한국시간 새벽 3시 17분 (UTC 18:17)
name: Supabase 깨우기
on:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch: {}   # Actions 탭에서 [Run workflow]로 바로 돌려볼 수 있게
permissions:
  actions: write   # 아래 '스스로 다시 켜기'용 (저장소 파일은 안 건드림)
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: DB에 작은 요청 보내기
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'apikey: sb_publishable_ZDDxH_TUePOMfhVZCGY1pw_1mgtfK9G' \
            'https://ioqxulvuasjsabcvikug.supabase.co/rest/v1/groups?select=id&limit=1')
          echo "응답 코드: $code"
          [ "$code" = "200" ] || { echo "⚠️ Supabase가 200이 아님 — 멈췄는지 확인 필요"; exit 1; }
      - name: 깃허브 60일 자동 꺼짐 막기 (스스로 다시 켜기)
        # 공개 저장소는 60일 동안 커밋이 없으면 예약 실행이 꺼짐 → 매번 '켜짐'으로 다시 설정해서 타이머를 새로 시작 (커밋 안 만듦)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable" && echo "다시 켜기 OK"
